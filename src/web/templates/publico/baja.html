{% extends "publico/base_publico.html" %}
{% block titulo %}Cancelar suscripción{% endblock %}
{% block contenido %}
<div class="pub-form">
  <h1>Cancelar avisos</h1>
  <p>Esto detiene los avisos para {{ correo }}. No elimina el historial técnico interno.</p>
  <form method="post">
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <label class="pub-check"><input type="checkbox" name="confirmar" required> Confirmo que quiero dejar de recibir avisos</label>
    <button class="pub-btn" type="submit">Cancelar suscripción</button>
  </form>
</div>
{% endblock %}
