<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block titulo %}Notificación de interrupciones de agua{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="/static/estilos.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark mb-4">
  <div class="container">
    <a class="navbar-brand" href="/">Interrupciones de agua — Lima Metropolitana</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="menu">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item"><a class="nav-link" href="/">Panel</a></li>
        <li class="nav-item"><a class="nav-link" href="/interrupciones">Interrupciones</a></li>
        <li class="nav-item"><a class="nav-link" href="/suscripciones">Suscripciones</a></li>
        <li class="nav-item"><a class="nav-link" href="/notificaciones">Notificaciones</a></li>
        <li class="nav-item"><a class="nav-link" href="/ejecuciones">Ejecuciones</a></li>
        <li class="nav-item"><a class="nav-link" href="/metricas">Métricas</a></li>
      </ul>
    </div>
  </div>
</nav>
<main class="container pb-5">
  <p class="aviso mb-4">{{ aviso_fuente }}</p>
  {% block contenido %}{% endblock %}
</main>
<footer class="container pb-4">
  Proyecto de tesis. El sistema no confirma cortes por vivienda ni sustituye los canales oficiales.
</footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
