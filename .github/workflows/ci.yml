name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  pruebas:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.6-alpine
        env:
          POSTGRES_USER: agua
          POSTGRES_PASSWORD: agua_ci
          POSTGRES_DB: notificaciones_agua_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agua -d notificaciones_agua_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
      DB_NAME: notificaciones_agua_test
      DB_USER: agua
      DB_PASSWORD: agua_ci
      SMTP_ENABLED: "false"
      MODO_ENVIO: simulacion
      ADMIN_PASSWORD: ""
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-python@v5.3.0
        with:
          python-version: "3.12"
      - name: Dependencias
        run: pip install -r requirements.txt
      - name: Pytest
        run: python -m pytest -q --tb=short
      - name: Compose config
        run: |
          docker compose -f compose.yaml config --quiet
          docker compose -f compose.yaml --profile publico config --quiet
          cp .env.production.example .env.production
          docker compose --env-file .env.production -f compose.prod.yaml config --quiet
          test -f scripts/start-web.sh
          test -f src/ciclo_produccion.py
      - name: Prometheus YAML
        run: |
          python -c "from pathlib import Path; t=Path('observability/prometheus/prometheus.yml').read_text(encoding='utf-8'); assert 'web:8000' in t"
      - name: Grafana dashboards
        run: |
          python -c "import json, pathlib; [json.loads(p.read_text(encoding='utf-8')) for p in pathlib.Path('observability/grafana/dashboards').glob('*.json')]"
          python -c "import json, pathlib; [json.loads(p.read_text(encoding='utf-8')) for p in pathlib.Path('n8n/workflows').glob('*.json')]"
      - name: Sin secretos versionados
        run: |
          if git ls-files | grep -E '(^|/)\.env(\.docker)?$'; then
            echo "No versionar .env ni .env.docker"
            exit 1
          fi
